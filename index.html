<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Dog Shopping Catalog</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
        <script type="module" src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script type="module" src="app.js"></script>
        <script type="module" src="api.js"></script>
        <script type="module" src="utils.js"></script>
    </head>
    <body>
        <header>
            <h1>Dog Shopping Catalog</h1>
            <div class="cart-icon">
                🛒 <span id="cart-count">0</span>
            </div>
        </header>
        <main>
            <section id="breed-selector">
                <label for="breed-dropdown">Select a Dog Breed:</label>
                <select id="breed-dropdown">
                    <!-- Options will be populated by JavaScript -->
                </select>
            </section>
            <section id="breed-info" class="hidden">
                <h2>Breed Information</h2>
                <div id="breed-details"></div>
            </section>
            <section id="available-dogs">
                <h2>Available Dogs</h2>
                <div id="dogs-container" class="grid-container"></div>
            </section>
            <section id="shopping-cart" class="hidden">
                <h2>Shopping Cart</h2>
                <div id="cart-items"></div>
                <div id="cart-total"></div>
                <button id="checkout-button">Proceed to Checkout</button>
            </section>
        </main>
        <div id="modal" class="modal hidden">
            <div class="modal-content">
                <span class="close-button">&times;</span>
                <h2>Purchase Details</h2>
                <form id="purchase-form">
                    <input type="text" placeholder="Name" required>
                    <input type="email" placeholder="Email" required>
                    <input type="tel" placeholder="Phone" required>
                    <button type="submit">Complete Purchase</button>
                </form>
            </div>
        </div>
    </body>
</html>
